name: Build Crypto Core

on:
  push:
    paths:
      - "crypto-core/**"
      - ".github/workflows/build-crypto-core.yml"
  workflow_dispatch: {}

jobs:
  windows-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build shamm_crypto.dll
        working-directory: crypto-core
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: shamm_crypto-windows-dll
          path: crypto-core/target/release/shamm_crypto.dll

  android-so:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Build libshamm_crypto.so for all Android ABIs
        working-directory: crypto-core
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android-jniLibs build --release
      - uses: actions/upload-artifact@v4
        with:
          name: shamm_crypto-android-jniLibs
          path: android-jniLibs
